<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1e2530;--sur:#28313f;--sur2:#212936;--brd:#35404f;
  --txt:#e8ecf1;--txt2:#8a96a8;--red:#e63946;--grn:#2ecc76;
  --gld:#f4a200;--blu:#5b9bd5;--pur:#a78bfa;
  --nav:58px;--r:12px;
  --sh:0 2px 12px rgba(0,0,0,.25);--shl:0 8px 32px rgba(0,0,0,.4);
  --cl:#1a2030;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
nav{background:var(--sur);border-bottom:1px solid var(--brd);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:var(--nav);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:16px;letter-spacing:2px;color:var(--red);cursor:pointer}
.nav-links{display:flex;gap:2px;flex-wrap:wrap}
.nav-btn{background:none;border:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--txt2);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.nav-btn:hover{background:var(--sur2);color:var(--txt)}
.nav-btn.active{background:rgba(230,57,70,.12);color:var(--red);font-weight:700}
.resume-btn{color:var(--grn)!important;display:none}
.resume-btn.on{display:inline-block!important}
main{max-width:980px;margin:0 auto;padding:24px 12px 48px}
.btn{font-family:inherit;font-weight:700;font-size:14px;padding:10px 20px;border-radius:10px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.bp{background:var(--red);color:#fff}.bp:hover{background:#c1121f}.bp:disabled{opacity:.4;cursor:not-allowed}
.bs{background:var(--sur);color:var(--txt);border:1px solid var(--brd)}.bs:hover{background:var(--sur2)}
.bico{background:var(--grn);color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.stitle{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);margin-bottom:14px}
.ifield{flex:1;background:var(--sur2);border:1.5px solid var(--brd);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:15px;color:var(--txt);outline:none}
.ifield:focus{border-color:var(--red)}
.irow{display:flex;gap:8px;margin-bottom:16px}
.mode-toggle{display:flex;background:var(--sur2);border:1px solid var(--brd);border-radius:999px;padding:3px;gap:3px;margin-bottom:16px}
.mode-btn{flex:1;border:none;border-radius:999px;padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--txt2);transition:all .2s}
.mode-btn.on{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(230,57,70,.35)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;background:var(--sur2);border:1px solid var(--brd);border-radius:8px;padding:8px 12px}
.pnum{font-family:'DM Mono',monospace;font-size:11px;color:var(--txt2);width:16px;flex-shrink:0}
.plbl{flex:1;font-weight:600;font-size:14px}
.pact{display:flex;gap:4px}
.rbtn{background:none;border:1px solid var(--brd);color:var(--txt2);border-radius:5px;width:26px;height:26px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rbtn:hover:not(:disabled){background:var(--sur);color:var(--txt)}.rbtn:disabled{opacity:.2;cursor:default}
.xbtn{background:none;border:1px solid rgba(230,57,70,.3);color:var(--red);border-radius:5px;width:26px;height:26px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin-left:2px}
.xbtn:hover{background:rgba(230,57,70,.1)}
.home-wrap{text-align:center;padding:48px 0 32px}
.hero-dice{font-size:64px;display:inline-block;margin-bottom:12px;animation:bounce 2s ease-in-out infinite;cursor:pointer;user-select:none}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes roll{0%{transform:translateY(0) rotate(0deg) scale(1)}20%{transform:translateY(-30px) rotate(180deg) scale(1.3)}50%{transform:translateY(-50px) rotate(360deg) scale(1.4)}75%{transform:translateY(-20px) rotate(540deg) scale(1.1)}90%{transform:translateY(4px) rotate(680deg) scale(.95)}100%{transform:translateY(0) rotate(720deg) scale(1)}}
.hero-dice.rolling{animation:roll .7s cubic-bezier(.22,1,.36,1) forwards}
.htitle{font-family:'Unbounded',sans-serif;font-size:44px;font-weight:900;letter-spacing:6px;color:var(--red);line-height:1}
.hsub{color:var(--txt2);font-size:14px;margin:10px 0 28px}
.cbanner{display:inline-flex;align-items:center;gap:10px;background:rgba(244,162,0,.08);border:1.5px solid rgba(244,162,0,.4);border-radius:var(--r);padding:12px 22px;color:var(--gld);font-weight:600;font-size:15px;margin-top:18px}
.mode-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.badge-c{background:rgba(91,155,213,.15);color:var(--blu)}
.badge-p{background:rgba(166,139,250,.15);color:var(--pur)}
.tscroll{overflow:auto;height:calc(100vh - var(--nav) - 80px);-webkit-overflow-scrolling:touch;border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;background:var(--sur)}
thead tr th{position:sticky;top:0;z-index:10;background:#28313f;border-bottom:2px solid var(--brd);padding:9px 8px;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);white-space:nowrap}
thead tr.turn-row th{background:#1a2236;color:var(--blu);font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;letter-spacing:0;text-transform:none;border-bottom:1px solid var(--brd);padding:7px 14px;text-align:left}
th.pcol{font-family:'Unbounded',sans-serif;font-size:11px;letter-spacing:0;text-transform:none;color:var(--blu);padding:9px 6px}
.cl{position:sticky;left:0;z-index:5;background:var(--cl);white-space:nowrap;text-align:left;padding-left:12px!important;padding-right:12px!important;box-shadow:inset -2px 0 0 rgba(91,155,213,.25)}
thead tr th.cl{z-index:15;background:var(--cl)}
thead tr.turn-row th.cl{background:#1a2236}
td{padding:6px 8px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tc{text-align:center;vertical-align:middle}
.tlbl{color:var(--txt);font-size:13px;font-weight:500;white-space:nowrap;cursor:help}
.sup-hdr th{background:#21293a!important;color:var(--blu);border-top:2px solid rgba(91,155,213,.2);border-bottom:2px solid rgba(91,155,213,.2);font-size:10px}
.inf-hdr th{background:#21293a!important;color:var(--blu);border-top:2px solid rgba(91,155,213,.2);border-bottom:2px solid rgba(91,155,213,.2);font-size:10px}
.sup-hdr th.cl{background:#1a2030!important}.inf-hdr th.cl{background:#1a2030!important}
.r-tot td{background:#232c38;font-weight:700}.r-bon td{background:#222e2a;font-weight:700}
.r-grand td{background:#2a2128;font-weight:900;font-size:15px;border-top:2px solid rgba(230,57,70,.25)}
.r-tot td.cl{background:#1c2535}.r-bon td.cl{background:#1b2630}.r-grand td.cl{background:#1e1f2e}
.ca{background:#2a3650!important}
thead tr th.ca{background:#2a3a52!important;color:var(--blu)!important}
.sinp{width:44px;background:var(--sur2);border:1.5px solid var(--brd);border-radius:7px;color:var(--txt);text-align:center;padding:5px 2px;font-family:'DM Mono',monospace;font-size:13px;outline:none;display:block;margin:0 auto}
.sinp:focus{border-color:var(--blu)}
.dbtn{width:44px;height:34px;background:var(--sur2);border:1.5px solid var(--brd);border-radius:7px;color:var(--txt2);font-family:'DM Mono',monospace;font-size:13px;font-weight:500;cursor:pointer;display:block;margin:0 auto;padding:0}
.dbtn:hover{background:#323e50;border-color:var(--blu)}
.dbtn.set{color:var(--txt);border-color:var(--blu);background:rgba(91,155,213,.1)}
.dbtn.bad{color:var(--red);border-color:rgba(230,57,70,.4);background:rgba(230,57,70,.07);font-size:16px}
.chk{width:34px;height:30px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto;user-select:none;border-radius:6px}
.chk:hover{background:rgba(255,255,255,.05)}
.chk.emp{font-size:0}.chk.emp::after{content:'';display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.2);border-radius:3px}
.leader{color:var(--gld)!important}
.game-act{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(3px)}
.mbox{background:var(--sur);border:1px solid var(--brd);border-radius:16px;padding:26px;width:90%;max-width:350px;box-shadow:var(--shl);animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mclose{background:none;border:none;color:var(--txt2);font-size:22px;cursor:pointer}
.cbox{background:var(--sur);border-radius:20px;padding:36px 40px;text-align:center;max-width:380px;width:90%;box-shadow:var(--shl);border:1px solid var(--brd);animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.cemoji{font-size:68px;display:block}
.ctitle{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;color:var(--txt);margin:10px 0 4px}
.cscore{font-size:18px;color:var(--txt2);margin-bottom:18px;font-family:'DM Mono',monospace}
.cact{display:flex;gap:10px;justify-content:center}
.ttp{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1f2b;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:300;cursor:pointer;max-width:270px;text-align:center;box-shadow:var(--shl);border:1px solid var(--brd);animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ttp strong{display:block;margin-bottom:2px}
.hw{max-width:660px;margin:0 auto}
.htoggle{display:flex;background:var(--sur2);border:1px solid var(--brd);border-radius:999px;padding:3px;gap:3px;margin-bottom:18px;max-width:300px}
.hcard{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.hhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdate{color:var(--txt2);font-size:13px}
.hwbadge{font-weight:700;font-size:12px;color:var(--gld);background:rgba(244,162,0,.1);border:1px solid rgba(244,162,0,.3);border-radius:999px;padding:3px 10px}
.hscores{display:flex;flex-wrap:wrap;gap:10px}
.hscore{display:flex;gap:8px;align-items:center;font-size:14px}
.pw{font-weight:700;font-family:'DM Mono',monospace;color:var(--gld)}
.po{font-weight:700;font-family:'DM Mono',monospace;color:var(--txt2)}
.cwrap{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:16px 12px 10px;margin-bottom:18px}
.ctitlec{font-family:'Unbounded',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);margin-bottom:10px}
.cleg{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.clegitem{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2)}
.cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hofwrap{max-width:640px;margin:0 auto}
.hofcard{background:rgba(244,162,0,.06);border:2px solid rgba(244,162,0,.3);border-radius:16px;padding:28px 32px;text-align:center;margin-bottom:22px}
.hofemoji{font-size:52px;display:block}
.hofname{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;color:var(--gld);margin:8px 0 2px}
.hofscore{font-size:20px;font-weight:700;color:var(--txt);font-family:'DM Mono',monospace}
.hofdate{font-size:12px;color:var(--txt2);margin-top:4px}
.rtable{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden}
.rtable table{width:100%}
.empty{text-align:center;padding:60px 0;color:var(--txt2)}
.eemoji{font-size:44px;display:block;margin-bottom:12px}
.empty p{font-size:16px;margin-bottom:18px}
/* Lang button */
#lang-btn{position:fixed;bottom:16px;right:16px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lang-pill{background:var(--sur);border:1px solid var(--brd);color:var(--txt);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--sh);display:flex;align-items:center;gap:5px}
.lang-menu{display:none;flex-direction:column;gap:4px;align-items:flex-end}
.lang-menu.open{display:flex}
.lang-opt{background:var(--sur);border:1px solid var(--brd);color:var(--txt2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.lang-opt:hover{color:var(--txt);background:var(--sur2)}
/* Online session */
.session-box{background:rgba(91,155,213,.08);border:1px solid rgba(91,155,213,.25);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.session-code{font-family:'Unbounded',sans-serif;font-size:24px;letter-spacing:6px;color:var(--blu);text-align:center;padding:10px 0}
.session-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(91,155,213,.12);border:1px solid rgba(91,155,213,.3);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--blu);font-weight:600}
.guest-bar{background:#1a2236;border-bottom:1px solid var(--brd);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--blu)}
.guest-readonly{background:rgba(230,57,70,.06);border:1px solid rgba(230,57,70,.2);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--red);font-weight:600}
  :root{--nav:50px}
  nav{padding:0 8px}.logo{font-size:12px;letter-spacing:1px}
  .nav-btn{font-size:11px;padding:5px 7px}
  main{padding:8px 4px 40px}
  .htitle{font-size:28px;letter-spacing:3px}.hero-dice{font-size:46px}
  .tscroll{height:calc(100vh - 50px - 110px)}
  thead tr th{font-size:9px;padding:6px 4px}th.pcol{font-size:9px;padding:6px 3px}
  td{padding:4px 4px;font-size:11px}.tlbl{font-size:10px}
  .sinp{width:34px;font-size:11px}.dbtn{width:34px;font-size:11px}
  .chk{font-size:17px;width:28px;height:26px}.r-grand td{font-size:12px}
  .game-act{flex-direction:column;align-items:stretch}.game-act .btn{justify-content:center}
  .cbox{padding:24px 16px}
}
</style>
</head>
<body>
<nav>
  <span class="logo" onclick="showView('home')" id="nav-logo">🎲 YAM'S</span>
  <div class="nav-links">
    <button class="nav-btn" id="nb-home"     onclick="showView('home')"></button>
    <button class="nav-btn" id="nb-history"  onclick="showView('history')"></button>
    <button class="nav-btn" id="nb-champion" onclick="showView('champion')"></button>
    <button class="nav-btn resume-btn" id="nb-resume" onclick="showView('game')"></button>
  </div>
</nav>
<main id="app"></main>
<div id="lang-btn">
  <div class="lang-menu" id="lang-menu"></div>
  <button class="lang-pill" id="lang-pill" onclick="toggleLangMenu()"></button>
</div>

// ── SVG DICE ──────────────────────────────────────────────────────────────
const DDOTS={1:[[18,18]],2:[[12,12],[24,24]],3:[[12,12],[18,18],[24,24]],4:[[12,12],[24,12],[12,24],[24,24]],5:[[12,12],[24,12],[18,18],[12,24],[24,24]],6:[[12,9],[24,9],[12,18],[24,18],[12,27],[24,27]]};
const DTINTS=["#e05c6a","#e8924a","#e8c94a","#5bba6f","#5b9bd5","#a78bfa"];
let _did=0;
function diceSVG(n,size,tint){
  const uid="d"+(++_did);
  const dots=(DDOTS[n]||DDOTS[1]).map(([cx,cy])=>`<circle cx="${cx}" cy="${cy}" r="3.4" fill="${n===1?"#e63946":"#333"}"/>`).join("");
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="${size}" height="${size}"><defs><filter id="${uid}f"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,.25)"/></filter></defs><rect x="2" y="2" width="32" height="32" rx="6" ry="6" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#${uid}f)"/>${tint?`<rect x="2" y="2" width="32" height="32" rx="6" ry="6" fill="${tint}" opacity="0.35"/>`:""}${dots}</svg>`;
  return "data:image/svg+xml;base64,"+btoa(svg);
}
function diceImg(n,size){return`<img src="${diceSVG(n,size,DTINTS[n-1])}" width="${size}" height="${size}" style="display:block;margin:0 auto" alt="${n}">`;}

const UKEYS=["ones","twos","threes","fours","fives","sixes"];
const ULABELS=["⚀","⚁","⚂","⚃","⚄","⚅"];
const COLORS=["#5b9bd5","#e63946","#2ecc76","#f4a200","#a78bfa","#f97316","#06b6d4","#ec4899"];

function getLower(){
  const classic=[
    {key:"chance",pts:0,  fixed:true, chance:true},
    {key:"brelan",pts:null,fixed:false},
    {key:"psuit", pts:25, fixed:true},
    {key:"full",  pts:30, fixed:true},
    {key:"gsuit", pts:35, fixed:true},
    {key:"carre", pts:40, fixed:true},
    {key:"yams",  pts:50, fixed:true},
  ];
  const custom=[
    {key:"plus",  pts:null,fixed:false},
    {key:"minus", pts:null,fixed:false},
    {key:"less11",pts:20, fixed:true},
    {key:"brelan",pts:null,fixed:false},
    {key:"psuit", pts:25, fixed:true},
    {key:"full",  pts:30, fixed:true},
    {key:"gsuit", pts:35, fixed:true},
    {key:"carre", pts:40, fixed:true},
    {key:"yams",  pts:50, fixed:true},
  ];
  return(S.mode==="classic"?classic:custom).map(r=>({...r,label:tLbl(r.key),desc:tRow(r.key)}));
}
function getAllKeys(){return[...UKEYS,...getLower().map(r=>r.key)];}

const S={view:"home",mode:"classic",lang:"fr",players:[],scores:{},finished:false,winner:null,nameInput:"",history:{classic:[],custom:[]},histView:"classic"};

function loadAll(){
  S.lang=localStorage.getItem("yams:lang")||detectLang();
  try{const r=localStorage.getItem("yams:h:classic");if(r)S.history.classic=JSON.parse(r);}catch{}
  try{const r=localStorage.getItem("yams:h:custom"); if(r)S.history.custom =JSON.parse(r);}catch{}
  try{const r=localStorage.getItem("yams:cur");if(r){const g=JSON.parse(r);if(g?.players?.length&&g?.scores){S.players=g.players;S.scores=g.scores;S.mode=g.mode||"classic";S.view="game";}}}catch{}
}
function saveHist(){try{localStorage.setItem(`yams:h:${S.mode}`,JSON.stringify(S.history[S.mode]));}catch{}}
function saveCur(){try{if(S.players.length&&!S.finished)localStorage.setItem("yams:cur",JSON.stringify({players:S.players,scores:S.scores,mode:S.mode}));}catch{}}
function clearCur(){try{localStorage.removeItem("yams:cur");}catch{}}

// ── CALC ──────────────────────────────────────────────────────────────────
const sumU=sc=>UKEYS.reduce((s,k)=>s+(sc[k]??0),0);
const bon=sc=>sumU(sc)>=63?37:0;
function sumL(sc,mode){const rows=mode==="classic"?["chance","brelan","psuit","full","gsuit","carre","yams"]:["plus","minus","less11","brelan","psuit","full","gsuit","carre","yams"];return rows.reduce((s,k)=>s+(sc[k]??0),0);}
const tot=(sc,mode=S.mode)=>sumU(sc)+bon(sc)+sumL(sc,mode);

function activePl(){
  if(!S.players.length)return null;
  const ak=getAllKeys();
  let min=Infinity;
  S.players.forEach(p=>{const f=ak.filter(k=>S.scores[p][k]!==null).length;if(f<min)min=f;});
  return S.players.find(p=>ak.filter(k=>S.scores[p][k]!==null).length===min);
}

function addP(){const n=S.nameInput.trim();if(!n||S.players.includes(n)||S.players.length>=8)return;S.players.push(n);S.nameInput="";render();}
function rmP(p){S.players=S.players.filter(q=>q!==p);render();}
function mvS(i,d){const j=i+d;if(j<0||j>=S.players.length)return;[S.players[i],S.players[j]]=[S.players[j],S.players[i]];render();}
function startGame(){
  if(!S.players.length)return;
  const ak=getAllKeys();
  S.scores={};S.players.forEach(p=>{S.scores[p]={};ak.forEach(k=>S.scores[p][k]=null);});
  S.finished=false;S.winner=null;saveCur();broadcast();showView("game");
}

// ── GAME ──────────────────────────────────────────────────────────────────
function vGame(){
  const PL=S.players,N=PL.length,act=activePl(),LOWER=getLower();
  const ak=[...UKEYS,...LOWER.map(r=>r.key)];
  const isComplete=PL.every(p=>ak.every(k=>S.scores[p][k]!==null));
  let maxT=-Infinity;PL.forEach(p=>{const v=tot(S.scores[p]);if(v>maxT)maxT=v;});

  const turnRow=act&&!S.finished?`<tr class="turn-row"><th class="cl"></th><th colspan="${N}">${t("turnOf")} <strong>${x(act)}</strong></th></tr>`:"";
  const pCols=PL.map(p=>{const a=p===act&&!S.finished;return`<th class="pcol${a?" ca":""}" data-player="${x(p)}">${a?"🎲 ":""}${x(p)}</th>`;}).join("");

  const dBtn=(p,row)=>{
    const a=p===act&&!S.finished,face={ones:1,twos:2,threes:3,fours:4,fives:5,sixes:6}[row.key];
    const max=face*5,v=S.scores[p][row.key],bad=v===0;
    return`<td class="tc${a?" ca":""}" data-player="${x(p)}"><button class="dbtn${bad?" bad":v!==null?" set":""}" data-dbtn="${row.key}" data-p="${x(p)}" data-face="${face}" data-max="${max}" onclick="cycleD('${x(p)}','${row.key}',${face},${max})">${bad?"🚫":v===null?"":v}</button></td>`;
  };
  const nCell=(p,key)=>{const a=p===act&&!S.finished,v=S.scores[p][key];
    return`<td class="tc${a?" ca":""}" data-player="${x(p)}"><input class="sinp" type="number" min="0" max="99" value="${v??""}" onchange="setScore('${x(p)}','${key}',this.value)" onfocus="this.select()"></td>`;
  };
  const cCell=(p,row)=>{const a=p===act&&!S.finished,v=S.scores[p][row.key];
    if(row.chance)return`<td class="tc${a?" ca":""}" data-player="${x(p)}"><div class="chk${v===null?" emp":""}" data-chk="${row.key}" data-p="${x(p)}" data-chance="1" onclick="togChk('${x(p)}','${row.key}')">${v===0?"✖️":""}</div></td>`;
    const ok=v===row.pts,bad=v===0;
    return`<td class="tc${a?" ca":""}" data-player="${x(p)}"><div class="chk${ok||bad?"":" emp"}" data-chk="${row.key}" data-p="${x(p)}" onclick="togChk('${x(p)}','${row.key}')">${ok?"✅":bad?"🚫":""}</div></td>`;
  };
  const tCells=(fn,k)=>PL.map(p=>{const a=p===act&&!S.finished,v=fn(S.scores[p]),lead=N>1&&v===maxT&&k==="t";
    return`<td class="tc${a?" ca":""}${lead?" leader":""}" data-tot="${k}" data-p="${x(p)}" style="font-family:'DM Mono',monospace">${v}${lead?" 👑":""}</td>`;}).join("");

    <td class="tlbl cl" onclick="showTip('${ULABELS[i]}',tRow('${key}'))" style="text-align:center;padding:4px 10px">${diceImg(i+1,32)}</td>

function cycleD(p,key,face,max){const cur=S.scores[p][key];S.scores[p][key]=cur===null?face:cur===0?null:cur+face<=max?cur+face:0;saveCur();broadcast();partialUpdate();}
function setScore(p,key,val){S.scores[p][key]=val===""?null:(parseInt(val)||0);saveCur();broadcast();partialUpdate();}
function togChk(p,key){
  const row=getLower().find(r=>r.key===key),cur=S.scores[p][key];

function partialUpdate(){
  const PL=S.players,act=activePl(),LOWER=getLower();
  let maxT=-Infinity;PL.forEach(p=>{const v=tot(S.scores[p]);if(v>maxT)maxT=v;});
  document.querySelectorAll("[data-dbtn]").forEach(b=>{
    const v=S.scores[b.dataset.p][b.dataset.dbtn],bad=v===0;
    b.textContent=bad?"🚫":v===null?"":v;
    b.className="dbtn"+(bad?" bad":v!==null?" set":"");
  });
  document.querySelectorAll("[data-tot]").forEach(el=>{
    const p=el.dataset.p,k=el.dataset.tot;
    const fns={u:sumU,b:bon,ub:sc=>sumU(sc)+bon(sc),l:sc=>sumL(sc,S.mode),t:sc=>tot(sc)};
    const v=fns[k](S.scores[p]),lead=PL.length>1&&v===maxT&&k==="t";
    el.textContent=v+(lead?" 👑":"");el.classList.toggle("leader",lead);
  });
  document.querySelectorAll("[data-chk]").forEach(el=>{
    const p=el.dataset.p,key=el.dataset.chk,row=LOWER.find(r=>r.key===key);if(!row)return;
    const v=S.scores[p][key];
    if(row.chance){el.textContent=v===0?"✖️":"";el.className="chk"+(v===null?" emp":"");}
    else{const ok=v===row.pts,bad=v===0;el.textContent=ok?"✅":bad?"🚫":"";el.className="chk"+(ok||bad?"":" emp");}
  });
  const tr=document.querySelector("thead tr.turn-row th:last-child");
  if(tr){if(act&&!S.finished)tr.innerHTML=`${t("turnOf")} <strong>${x(act)}</strong>`;
    else document.querySelector("thead tr.turn-row")?.style&&(document.querySelector("thead tr.turn-row").style.display="none");}
  document.querySelectorAll("th.pcol").forEach(th=>{const p=th.dataset.player,a=p===act&&!S.finished;th.classList.toggle("ca",a);th.innerHTML=(a?"🎲 ":"")+x(p);th.dataset.player=p;});
  document.querySelectorAll("td[data-player]").forEach(td=>td.classList.toggle("ca",td.dataset.player===act&&!S.finished));
  const ak=getAllKeys(),isComplete=PL.every(p=>ak.every(k=>S.scores[p][k]!==null));
  const fb=document.getElementById("fbtn");if(fb){fb.disabled=!isComplete;fb.textContent=isComplete?t("finish"):t("inProgress");}
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

// ── HISTORY ───────────────────────────────────────────────────────────────
function buildChart(hist){
  const allP=[...new Set(hist.flatMap(g=>g.players))],pc={};allP.forEach((p,i)=>pc[p]=COLORS[i%COLORS.length]);
  const chrono=[...hist].reverse(),nG=chrono.length;
  if(nG<2)return{chart:"",pc};
  const W=560,H=200,PL=36,PR=16,PT=16,PB=28,cW=W-PL-PR,cH=H-PT-PB;
  let mn=Infinity,mx=-Infinity;chrono.forEach(g=>Object.values(g.totals).forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v;}));mn=Math.max(0,mn-20);mx+=20;
  const xp=i=>nG<2?PL+cW/2:PL+(i/(nG-1))*cW,yp=v=>PT+cH-((v-mn)/(mx-mn))*cH;
  const grid=[mn,Math.round((mn+mx)/2),mx].map(v=>`<line x1="${PL}" y1="${yp(v)}" x2="${PL+cW}" y2="${yp(v)}" stroke="#35404f" stroke-width="1" stroke-dasharray="4,3"/><text x="${PL-4}" y="${yp(v)+4}" text-anchor="end" font-size="9" fill="#8a96a8">${v}</text>`).join("");
  const xlbls=chrono.map((g,i)=>`<text x="${xp(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#8a96a8">${g.date.slice(0,5)}</text>`).join("");
  const paths=allP.map(p=>{const col=pc[p];
    const pts=chrono.map((g,i)=>g.totals[p]!==undefined?{x:xp(i),y:yp(g.totals[p]),s:g.totals[p],d:g.date}:null);
    let segs=[],cur=[];pts.forEach(pt=>{if(pt)cur.push(pt);else if(cur.length){segs.push(cur);cur=[];}});if(cur.length)segs.push(cur);
    const lines=segs.map(seg=>{if(seg.length===1)return`M${seg[0].x} ${seg[0].y}`;let d=`M${seg[0].x} ${seg[0].y}`;for(let k=1;k<seg.length;k++){const cp=(seg[k-1].x+seg[k].x)/2;d+=` C${cp} ${seg[k-1].y} ${cp} ${seg[k].y} ${seg[k].x} ${seg[k].y}`;}return d;}).join(" ");
    const dots=pts.map(pt=>pt?`<circle cx="${pt.x}" cy="${pt.y}" r="4" fill="${col}" stroke="#28313f" stroke-width="2"><title>${p}: ${pt.s} ${t("pts")} — ${pt.d}</title></circle>`:"").join("");
    return`<path d="${lines}" fill="none" stroke="${col}" stroke-width="2.5"/>${dots}`;
  }).join("");
  const leg=allP.map(p=>`<div class="clegitem"><div class="cdot" style="background:${pc[p]}"></div><span>${x(p)}</span></div>`).join("");
  return{pc,chart:`<div class="cwrap"><div class="ctitlec">${t("histChart")}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible">${grid}${xlbls}${paths}</svg><div class="cleg">${leg}</div></div>`};
}

function delGame(mode,id){if(!confirm(t("confirmDel")))return;S.history[mode]=S.history[mode].filter(g=>g.id!==id);localStorage.setItem(`yams:h:${mode}`,JSON.stringify(S.history[mode]));render();}
function exportH(mode){const b=new Blob([JSON.stringify(S.history[mode],null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`yams-${mode}-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);}
function importH(ev,mode){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=e2=>{
    try{const d=JSON.parse(e2.target.result);if(!Array.isArray(d))throw new Error(t("histNone"));
      const ex=new Set(S.history[mode].map(g=>g.id));const added=d.filter(g=>g.id&&!ex.has(g.id));
      S.history[mode]=[...S.history[mode],...added].sort((a,b)=>b.id-a.id);
      localStorage.setItem(`yams:h:${mode}`,JSON.stringify(S.history[mode]));render();alert(t("impOk")(added.length));
    }catch(err){alert("❌ "+err.message);}
  };r.readAsText(f);ev.target.value="";
}

  hist.forEach(g=>Object.entries(g.totals).forEach(([n,s])=>{if(!c||s>c.score)c={name:n,score:s,date:g.date};}));return c;
}

  </tr>`).join("");
  return`<div class="hofwrap">
    <div class="hofcard"><span class="hofemoji">👑</span><div class="hofname">${x(champ.name)}</div><div class="hofscore">${champ.score} ${t("pts")}</div><div class="hofdate">${champ.date}</div></div>
    <p class="stitle">${t("champTitle")}</p>
    <div class="rtable"><table>
      <thead><tr><th>#</th><th style="text-align:left">${t("champPlayer")}</th><th>${t("champBest")}</th><th>${t("champWins")}</th><th>${t("champGames")}</th><th>${t("champAvg")}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

// ── PEER-TO-PEER ──────────────────────────────────────────────────────────
let _peer=null, _conns=[], _guestConn=null, _sessionCode=null;
let _isGuest=false, _guestState=null, _guestStatus="";
let _onlineMode=false;
let _peerOpen=false; // true uniquement quand le serveur a confirmé la connexion

function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('');
}

function getShareState(){
  return{view:S.view,mode:S.mode,lang:S.lang,players:S.players,scores:JSON.parse(JSON.stringify(S.scores)),finished:S.finished,winner:S.winner};
}

function broadcast(){
  if(!_peer||!_conns.length)return;
  const d={type:'state',data:getShareState()};
  _conns.forEach(c=>{try{c.send(d);}catch{}});
  updateGuestCount();
}

function updateGuestCount(){
  const el=document.getElementById('guest-count');
  if(el)el.textContent=_conns.length>0?`👤 ${_conns.length}`:'';
}

const PEER_CFG={
  host:'yam-iamax.onrender.com', port:443, secure:true, path:'/yam',
  config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
  ]}
};

function createRoom(attempt=0){
  if(_peer)return;
  const code=attempt===0?genCode():_sessionCode;
  _sessionCode=code;
  _peerOpen=false;
  render(); // affiche "Connexion…" tout de suite
  const peer=new Peer('yam-'+code, PEER_CFG);
  _peer=peer;
  const timeout=setTimeout(()=>{
    if(!_peerOpen){
      peer.destroy();_peer=null;_peerOpen=false;
      if(attempt<2){setTimeout(()=>createRoom(attempt+1),2000);}
      else{_sessionCode=null;render();}
    }
  },15000); // 15s pour laisser Render se réveiller
  peer.on('open',()=>{
    clearTimeout(timeout);
    _peerOpen=true;
    render();
  });
  peer.on('connection',conn=>{
    conn.on('open',()=>{
      _conns.push(conn);
      conn.send({type:'state',data:getShareState()});
      updateGuestCount();render();
      conn.on('data',d=>{if(d.type==='hello')conn.send({type:'state',data:getShareState()});});
      conn.on('close',()=>{_conns=_conns.filter(c=>c!==conn);updateGuestCount();render();});
    });
  });
  peer.on('error',err=>{
    if(_peerOpen){
      if(err.type==='peer-unavailable')return;
      return;
    }
    clearTimeout(timeout);
    if(err.type==='unavailable-id'){_peer=null;_peerOpen=false;_sessionCode=null;createRoom(0);}
    else if(attempt<2){_peer=null;_peerOpen=false;setTimeout(()=>createRoom(attempt+1),2000);}
    else{_peer=null;_peerOpen=false;_sessionCode=null;render();}
  });
}

function stopSession(){
  if(_peer){_peer.destroy();_peer=null;}
  _conns=[];_sessionCode=null;_peerOpen=false;render();
}

function updateSessionUI(status){
  const el=document.getElementById('session-status');
  if(!el)return;
  if(status==='connecting')el.innerHTML=`<span style="color:var(--txt2)">⏳ Connexion…</span>`;
  else if(status==='open')el.innerHTML=`<span style="color:var(--grn)">✅ Session active</span>`;
  else if(status==='error')el.innerHTML=`<span style="color:var(--red)">❌ Erreur réseau</span>`;
}

// GUEST
function showJoinUI(){
  const existing=document.getElementById('join-modal');if(existing)existing.remove();
  const modal=document.createElement('div');modal.id='join-modal';modal.className='overlay';
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  modal.innerHTML=`<div class="mbox">
    <div class="mhead">
      <span class="stitle" style="margin:0">${t("joinTitle")}</span>
      <button class="mclose" onclick="document.getElementById('join-modal').remove()">×</button>
    </div>
    <p style="font-size:13px;color:var(--txt2);margin-bottom:14px">${t("joinHint")}</p>
    <input id="join-code" class="ifield" type="text" placeholder="${t("joinPlaceholder")}" maxlength="6"
      style="text-transform:uppercase;letter-spacing:4px;font-size:20px;text-align:center;width:100%;margin-bottom:12px"
      oninput="this.value=this.value.toUpperCase()">
    <div id="join-status" style="min-height:20px;font-size:13px;margin-bottom:12px;text-align:center"></div>
    <button class="btn bp" style="width:100%;justify-content:center" onclick="connectAsGuest()">${t("joinConnect")}</button>
  </div>`;
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('join-code')?.focus(),100);
}

function connectAsGuest(){
  const input=document.getElementById('join-code');
  if(!input)return;
  const code=input.value.trim().toUpperCase();
  if(code.length<4){const s=document.getElementById('join-status');if(s)s.textContent=t('joinTooShort');return;}
  const statusEl=document.getElementById('join-status');
  if(statusEl)statusEl.innerHTML=`<span style="color:var(--txt2)">${t('joinConnecting')}</span>`;
  // No custom host = PeerJS cloud server
  const peer=new Peer();
  // Timeout if no connection after 10s
  const timeout=setTimeout(()=>{
    peer.destroy();
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--red)">${t('joinError')}</span>`;
  },10000);
  peer.on('open',()=>{
    const conn=peer.connect('yam-'+code,{reliable:true});
    _guestConn=conn;
    // Timeout for the actual P2P connection
    const connTimeout=setTimeout(()=>{
      if(!_isGuest){
        peer.destroy();
        if(statusEl)statusEl.innerHTML=`<span style="color:var(--red)">${t('joinError')}</span>`;
      }
    },8000);
    conn.on('open',()=>{
      clearTimeout(timeout);clearTimeout(connTimeout);
      _isGuest=true;
      conn.send({type:'hello'});
      document.getElementById('join-modal')?.remove();
    });
    conn.on('data',d=>{
      if(d.type==='state'){_guestState=d.data;renderGuest();}
    });
    conn.on('close',()=>{
      _guestStatus='lost';_isGuest=false;renderGuest();
    });
    conn.on('error',()=>{
      clearTimeout(connTimeout);
      if(statusEl)statusEl.innerHTML=`<span style="color:var(--red)">${t('joinError')}</span>`;
    });
  });
  peer.on('error', err => {
    clearTimeout(timeout);
    const msg = {
      'peer-unavailable': t('joinError'),       // code invalide
      'network':          '❌ Serveur inaccessible (network)',
      'socket-error':     '❌ Erreur socket (socket-error)',
      'socket-closed':    '❌ Socket fermée (socket-closed)',
      'unavailable-id':   '❌ ID indisponible (unavailable-id)',
      'server-error':     '❌ Erreur serveur (server-error)',
    }[err.type] || `❌ ${err.type}`;
    if(statusEl) statusEl.innerHTML=`<span style="color:var(--red)">${msg}</span>`;
  });
}

function disconnectGuest(){
  if(_guestConn){_guestConn.close();_guestConn=null;}
  _isGuest=false;_guestState=null;_guestStatus="";showView('home');
}

function renderGuest(){
  if(!_isGuest&&_guestStatus!=='lost'){showView('home');return;}
  if(_guestStatus==='lost'){
    document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">📡</div>
      <h2 style="color:var(--red);font-family:'Unbounded',sans-serif;font-size:18px;margin-bottom:12px">${t("guestLostTitle")}</h2>
      <p style="color:var(--txt2);margin-bottom:24px">${t("guestLostMsg")}</p>
      <button class="btn bp" onclick="disconnectGuest()">${t("guestBack")}</button>
    </div>`;return;
  }
  if(!_guestState){
    document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--txt2)">${t("guestWaitData")}</div>`;return;
  }
  const gs=_guestState;
  if(gs.view!=='game'||!gs.players?.length){
    document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">⏳</div>
      <p style="color:var(--txt2);font-size:16px">${t("guestWaiting")}</p>
      <button class="btn bs" style="margin-top:24px" onclick="disconnectGuest()">${t("guestLeave")}</button>
    </div>`;return;
  }
  // Read-only game view
  const PL=gs.players,N=PL.length,scores=gs.scores;
  const LOWER_C=[{key:"chance",pts:0,fixed:true,chance:true},{key:"brelan",pts:null,fixed:false},{key:"psuit",pts:25,fixed:true},{key:"full",pts:30,fixed:true},{key:"gsuit",pts:35,fixed:true},{key:"carre",pts:40,fixed:true},{key:"yams",pts:50,fixed:true}];
  const LOWER_P=[{key:"plus",pts:null,fixed:false},{key:"minus",pts:null,fixed:false},{key:"less11",pts:20,fixed:true},{key:"brelan",pts:null,fixed:false},{key:"psuit",pts:25,fixed:true},{key:"full",pts:30,fixed:true},{key:"gsuit",pts:35,fixed:true},{key:"carre",pts:40,fixed:true},{key:"yams",pts:50,fixed:true}];
  const LOWER=(gs.mode==='classic'?LOWER_C:LOWER_P).map(r=>({...r,label:tLbl(r.key),desc:tRow(r.key)}));
  const sumUg=sc=>UKEYS.reduce((s,k)=>s+(sc?.[k]??0),0);
  const bong=sc=>sumUg(sc)>=63?37:0;
  const sumLg=(sc,mode)=>(mode==='classic'?LOWER_C:LOWER_P).map(r=>r.key).reduce((s,k)=>s+(sc?.[k]??0),0);
  const totg=sc=>sumUg(sc)+bong(sc)+sumLg(sc,gs.mode);
  let maxT=-Infinity;PL.forEach(p=>{const v=totg(scores[p]);if(v>maxT)maxT=v;});

  const pCols=PL.map(p=>{const lead=totg(scores[p])===maxT&&N>1;return`<th class="pcol${lead?" leader":""}" style="${lead?"color:var(--gld)":""}">${lead?"👑 ":""}${x(p)}</th>`;}).join("");

  const upRows=UKEYS.map((key,i)=>`<tr>
    <td class="tlbl cl" style="text-align:center;padding:4px 10px">${diceImg(i+1,32)}</td>
    ${PL.map(p=>{const v=scores[p]?.[key];return`<td class="tc" style="font-family:'DM Mono',monospace">${v===0?"🚫":v===null?"":v}</td>`;}).join("")}</tr>`).join("");

  const loRows=LOWER.map(row=>`<tr>
    <td class="tlbl cl" style="padding:5px 10px">
      <span style="display:block;font-size:13px;font-weight:500">${x(row.label)}</span>
      ${row.pts&&!row.chance?`<span style="font-size:10px;color:var(--txt2)">${row.pts} pts</span>`:""}
    </td>
    ${PL.map(p=>{const v=scores[p]?.[row.key];
      if(row.chance)return`<td class="tc">${v===0?"✖️":""}</td>`;
      if(row.fixed){const ok=v===row.pts,bad=v===0;return`<td class="tc">${ok?"✅":bad?"🚫":""}</td>`;}
      return`<td class="tc" style="font-family:'DM Mono',monospace">${v===null||v===undefined?"":v}</td>`;
    }).join("")}</tr>`).join("");

  const tCells=(fn)=>PL.map(p=>{const v=fn(scores[p]),lead=v===maxT&&N>1;return`<td class="tc${lead?" leader":""}" style="font-family:'DM Mono',monospace">${v}${lead?" 👑":""}</td>`;}).join("");

  document.getElementById('app').innerHTML=`
    <div class="guest-bar">
      <span>${t("guestBar")}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="guest-readonly">${t("guestReadonly")}</span>
        <button class="btn bs" onclick="disconnectGuest()" style="font-size:12px;padding:5px 10px">${t("guestLeave")}</button>
      </div>
    </div>
    <div class="tscroll" style="height:calc(100vh - var(--nav) - 44px)">
      <table>
        <thead>
          ${gs.finished?`<tr class="turn-row"><th class="cl"></th><th colspan="${N}">${t("guestWin")(x(gs.winner))}</th></tr>`:""}
          <tr class="sup-hdr"><th class="cl">${t("colPlayers")}</th>${pCols}</tr>
        </thead>
        <tbody>
          ${upRows}
          <tr class="r-tot"><td class="tlbl cl" style="font-size:11px;color:var(--blu)">${t("totSup")}</td>${tCells(sumUg)}</tr>
          <tr class="r-bon"><td class="tlbl cl" style="font-size:11px;color:var(--txt2)">${t("bonus63")}</td>${PL.map(p=>`<td class="tc" style="font-family:'DM Mono',monospace">${bong(scores[p])}</td>`).join("")}</tr>
          <tr class="r-tot"><td class="tlbl cl" style="font-size:11px;color:var(--txt2)">${t("plusBonus")}</td>${PL.map(p=>`<td class="tc" style="font-family:'DM Mono',monospace">${sumUg(scores[p])+bong(scores[p])}</td>`).join("")}</tr>
          <tr class="inf-hdr"><th class="cl">${t("inferior")}</th>${PL.map(()=>`<th></th>`).join("")}</tr>
          ${loRows}
          <tr class="r-tot"><td class="tlbl cl" style="font-size:11px;color:var(--pur)">${t("totInf")}</td>${tCells(sc=>sumLg(sc,gs.mode))}</tr>
          <tr class="r-grand"><td class="tlbl cl" style="font-weight:900;font-size:13px">${t("total")}</td>${tCells(totg)}</tr>
        </tbody>
      </table>
    </div>`;
}


function x(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

loadAll();
render();
