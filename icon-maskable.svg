<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed background for maskable (no radius) -->
  <rect width="512" height="512" fill="#1e2530"/>
  <!-- Subtle gradient overlay -->
  <radialGradient id="g" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e63946" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#1e2530" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- Dice emoji centered with safe zone padding (40px each side = ~15%) -->
  <text x="256" y="320" text-anchor="middle" font-size="220" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🎲</text>
</svg>
